name: データとPWAの検証
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install 'tqdm==4.67.3' 'beautifulsoup4==4.14.3' 'soupsieve==2.8.3'
      - run: .venv/bin/python -m unittest discover -s tests
      - run: node tests/test_ui_behavior.cjs
      - run: node tests/test_service_worker.cjs
      - run: .venv/bin/python merge_data.py --check
      - run: .venv/bin/python verify_patch_data.py --check
      - run: .venv/bin/python verify_matchup_fix.py
